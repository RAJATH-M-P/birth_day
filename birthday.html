<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Happy Birthday!</title>
    <style>
        :root {
            --bg-start: #fdf7ff;
            --bg-middle: #d4e8ff;
            --bg-end: #8cb7ff;
            --card: rgba(255, 255, 255, 0.92);
            --text: #2d3a5b;
            --accent: #ff4d6d;
            --accent-soft: #ff9ca3;
        }

        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #fdf7ff 0%, #d4e8ff 35%, #8cb7ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text);
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            z-index: 5;
            pointer-events: auto;
        }

        .intro-section {
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        .intro-text {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            color: #4b5772;
            margin: 0;
            padding: 0.8rem 1.2rem;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .title {
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: var(--accent);
            margin: 0.8rem 0 0;
            font-weight: 900;
            letter-spacing: -0.02em;
            animation: pop 0.8s ease;
            line-height: 1.1;
        }

        .title-line-2 {
            margin-top: 0.2rem;
        }

        .heart {
            font-size: clamp(2rem, 6vw, 3rem);
            margin: 0.6rem 0;
        }

        .message {
            font-size: clamp(0.95rem, 3.5vw, 1.1rem);
            color: #3f4f77;
            line-height: 1.6;
            margin: 0.8rem 0;
            text-align: center;
            max-width: 90%;
        }

        .message-box {
            background: rgba(255, 255, 255, 0.85);
            padding: 1.2rem;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin: 0.8rem auto;
        }

        .celebrate-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            margin: 0.6rem 0 0.8rem 0;
            width: 100%;
        }

        .celebrate-text {
            font-size: clamp(1rem, 4vw, 1.3rem);
            color: #3f4f77;
            font-weight: 600;
            margin: 0;
            text-align: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #ff5a76 0%, #ffa297 100%);
            color: white;
            border: none;
            border-radius: 999px;
            padding: clamp(10px 20px, 3vw 5vw, 16px 32px);
            font-size: clamp(0.95rem, 3vw, 1.1rem);
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(255, 91, 116, 0.25);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 16px 40px rgba(255, 91, 116, 0.32);
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(255,255,255,0.4), transparent 60%);
            opacity: 0.5;
        }

        .party-text {
            font-size: clamp(1rem, 4vw, 1.3rem);
            color: #3f4f77;
            font-weight: 600;
            margin: 1rem 0 0;
            text-align: center;
            animation: slideUp 0.6s ease;
        }

        .confetti-piece {
            position: fixed;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            opacity: 0.95;
            pointer-events: none;
            animation: fall 3s ease-in forwards;
            z-index: 10;
        }

        .intro-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 45, 105, 0.8);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .intro-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .intro-emoji {
            font-size: clamp(5rem, 15vw, 8rem);
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.9);
            animation: pulse 1.2s ease-in-out;
        }

        .star {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff7a8;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
            opacity: 0;
            pointer-events: none;
            animation: sparkle 1.5s ease forwards;
            z-index: 10;
        }

        .balloon {
            position: fixed;
            font-size: clamp(2.5rem, 8vw, 4rem);
            animation: float 4s ease-in-out infinite;
            z-index: 3;
            pointer-events: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pop {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes sparkle {
            0% { opacity: 1; transform: translateY(0) scale(0.9); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.8); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-30px) rotate(2deg); }
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(540deg); opacity: 0; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body {
                padding: 0.8rem;
            }

            .container {
                gap: 0.8rem;
            }

            .message-box {
                padding: 0.9rem;
                margin: 0.6rem auto;
            }

            .btn {
                max-width: 90%;
            }

            .balloon {
                font-size: clamp(2rem, 6vw, 3rem);
            }
        }

        @media (max-height: 600px) {
            body {
                padding: 0.5rem;
            }

            .container {
                gap: 0.5rem;
            }

            .message-box {
                padding: 0.7rem 0.9rem;
            }

            .title {
                margin: 0.4rem 0 0;
            }

            .heart {
                margin: 0.3rem 0;
            }
        }
    </style>
</head>
<body>
    <div id="introOverlay" class="intro-overlay">
        <span id="introEmoji" class="intro-emoji">✨</span>
    </div>

    <div class="container">
        <div class="intro-section">
            <p class="intro-text">🎉 Make a wish and press celebrate!</p>
        </div>

        <div style="text-align: center;">
            <h1 class="title">Happy</h1>
            <h1 class="title title-line-2">Birthday</h1>
            <div class="heart">❤️</div>

            <div class="celebrate-section">
                <p class="celebrate-text">Ready to celebrate?</p>
                <button class="btn" onclick="celebrate()">🎉 Celebrate! Yours day</button>
            </div>
        </div>

        <div class="message-box">
            <p class="message">Wishing you a day filled with joy, laughter, and unforgettable memories.</p>
            <p class="message" style="font-weight: 500;">Let's make this celebration extra special!</p>
            <p class="message" style="margin-bottom: 0; font-weight: 600;">Today is yours ❤️</p>
        </div>

        <p id="partyText" class="party-text" style="display: none;">Let the party begin! 🎊</p>
    </div>

    <audio id="birthdayAudio" src="birthday-song.mp3" preload="auto"></audio>

    <script>
        const introOverlay = document.getElementById('introOverlay');
        const introEmoji = document.getElementById('introEmoji');
        const partyText = document.getElementById('partyText');

        function celebrate() {
            showIntroEmoji();
        }

        function showIntroEmoji() {
            const emojis = ['✨', '🎂', '🎈', '🥳', '🎉'];
            introEmoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            introOverlay.classList.add('visible');

            setTimeout(() => {
                introOverlay.classList.remove('visible');
                startBirthdayExperience();
            }, 1200);
        }

        function startBirthdayExperience() {
            if (partyText) {
                partyText.style.display = 'block';
            }
            
            createStars(14);
            createConfetti(60);
            playCelebrationAudio();

            setTimeout(() => {
                createStars(18);
                createConfetti(60);
            }, 1200);

            setTimeout(() => {
                alert('🎉 HAPPY BIRTHDAY! 🎉\n\nHave an amazing day! 🥳');
            }, 2800);
        }

        function createConfetti(amount) {
            for (let i = 0; i < amount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                const size = 8 + Math.random() * 12;
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size}px`;
                confetti.style.left = `${Math.random() * window.innerWidth}px`;
                confetti.style.top = `${-40 - Math.random() * 40}px`;
                confetti.style.backgroundColor = ['#ff6b81', '#ffd166', '#4ea8ff', '#70ffb1', '#8257e5'][Math.floor(Math.random() * 5)];
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                confetti.style.animationDuration = `${2 + Math.random() * 2}s`;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4500);
            }
        }

        function createStars(amount) {
            for (let i = 0; i < amount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = `${Math.random() * window.innerWidth}px`;
                star.style.top = `${Math.random() * window.innerHeight}px`;
                star.style.animationDuration = `${1 + Math.random() * 1}s`;
                document.body.appendChild(star);
                setTimeout(() => star.remove(), 1600);
            }
        }

        function playCelebrationAudio() {
            const audio = document.getElementById('birthdayAudio');
            if (audio && typeof audio.play === 'function') {
                audio.currentTime = 0;
                audio.play().catch(() => playBirthdaySong());
            } else {
                playBirthdaySong();
            }
        }

        function playBirthdaySong() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                const notes = [
                    { freq: 262, duration: 0.5 },
                    { freq: 262, duration: 0.5 },
                    { freq: 294, duration: 1 },
                    { freq: 262, duration: 1 },
                    { freq: 330, duration: 1 },
                    { freq: 294, duration: 2 },
                    { freq: 262, duration: 0.5 },
                    { freq: 262, duration: 0.5 },
                    { freq: 294, duration: 1 },
                    { freq: 262, duration: 1 },
                    { freq: 349, duration: 1 },
                    { freq: 330, duration: 2 }
                ];

                let currentTime = audioContext.currentTime;
                notes.forEach(note => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    oscillator.frequency.value = note.freq;
                    gainNode.gain.setValueAtTime(0.3, currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, currentTime + note.duration);
                    oscillator.start(currentTime);
                    oscillator.stop(currentTime + note.duration);
                    currentTime += note.duration;
                });
            } catch (error) {
                console.log('Audio not available, but celebration continues!');
            }
        }
    </script>
</body>
</html>
