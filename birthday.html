<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Happy Birthday!</title>
    <style>
        :root {
            --text: #392b49;
            --muted: #766a83;
            --accent: #d83f72;
            --accent-dark: #a92e65;
            --card: rgba(255, 252, 250, 0.88);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(ellipse at 12% 12%, rgba(255, 206, 194, 0.75), transparent 34%),
                radial-gradient(ellipse at 88% 82%, rgba(184, 159, 230, 0.62), transparent 36%),
                linear-gradient(145deg, #fff3e7 0%, #f9dbe6 48%, #d7c9ef 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
                max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.15rem;
            padding: clamp(1.25rem, 5vw, 2.5rem);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.82);
            border-radius: 32px;
            background: var(--card);
            box-shadow: 0 28px 80px rgba(83, 48, 83, 0.18), 0 4px 16px rgba(83, 48, 83, 0.08);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
            z-index: 5;
            pointer-events: auto;
        }

        .container::before,
        .container::after {
            content: "";
            position: absolute;
            width: 150px;
            aspect-ratio: 1;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }

        .container::before {
            top: -88px;
            right: -62px;
            background: rgba(255, 193, 177, 0.3);
        }

        .container::after {
            bottom: -112px;
            left: -78px;
            background: rgba(194, 170, 229, 0.28);
        }

        .intro-section {
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        .intro-text {
            font-size: clamp(0.78rem, 2.8vw, 0.9rem);
            color: var(--accent-dark);
            margin: 0;
            padding: 0.65rem 1rem;
            background: rgba(255, 229, 224, 0.78);
            border: 1px solid rgba(216, 63, 114, 0.1);
            border-radius: 999px;
            font-weight: 700;
            letter-spacing: 0.025em;
        }

        .title {
            font-size: clamp(3.25rem, 13vw, 5.5rem);
            color: var(--accent);
            background: linear-gradient(135deg, #c83068 12%, #ed716d 58%, #f0a34c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0.35rem 0 0;
            font-weight: 900;
            letter-spacing: -0.065em;
            animation: pop 0.8s ease;
            line-height: 0.98;
        }

        .title-line-2 {
            margin-top: 0;
        }

        .heart {
            font-size: clamp(2rem, 7vw, 2.8rem);
            margin: 0.8rem 0 0.35rem;
            filter: drop-shadow(0 8px 12px rgba(216, 63, 114, 0.18));
            animation: pulse 2.4s ease-in-out infinite;
        }

        .message {
            font-size: clamp(0.95rem, 3.6vw, 1.05rem);
            color: var(--muted);
            line-height: 1.65;
            margin: 0.55rem 0;
            text-align: center;
            max-width: 34rem;
        }

        .message-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.64);
            padding: 1rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 22px;
            margin: 0;
        }

        .celebrate-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.9rem;
            margin: 0.9rem 0 0.25rem;
            width: 100%;
        }

        .celebrate-text {
            font-size: clamp(1rem, 4vw, 1.3rem);
            color: var(--muted);
            font-weight: 600;
            margin: 0 0 0.1rem;
            text-align: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 52px;
            max-width: 100%;
            padding: 0.9rem 1.6rem;
            background: linear-gradient(135deg, #d83f72 0%, #ec7868 100%);
            color: white;
            border: none;
            border-radius: 999px;
            font-size: clamp(0.95rem, 3vw, 1.1rem);
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 26px rgba(191, 53, 101, 0.25);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            text-align: center;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 16px 34px rgba(191, 53, 101, 0.3);
        }

        .btn:focus-visible {
            outline: 3px solid #6d4a91;
            outline-offset: 4px;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(255,255,255,0.4), transparent 60%);
            opacity: 0.5;
        }

        .party-text {
            font-size: clamp(1rem, 4vw, 1.3rem);
            color: var(--accent-dark);
            font-weight: 600;
            margin: 1rem 0 0;
            text-align: center;
            animation: slideUp 0.6s ease;
        }

        .confetti-piece {
            position: fixed;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            opacity: 0.95;
            pointer-events: none;
            animation: fall 3s ease-in forwards;
            z-index: 10;
        }

        .intro-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 45, 105, 0.8);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .intro-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .intro-emoji {
            font-size: clamp(5rem, 15vw, 8rem);
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.9);
            animation: pulse 1.2s ease-in-out;
        }

        .star {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff7a8;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
            opacity: 0;
            pointer-events: none;
            animation: sparkle 1.5s ease forwards;
            z-index: 10;
        }

        .balloon {
            position: fixed;
            font-size: clamp(2.5rem, 8vw, 4rem);
            animation: float 4s ease-in-out infinite;
            z-index: 3;
            pointer-events: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pop {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes sparkle {
            0% { opacity: 1; transform: translateY(0) scale(0.9); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.8); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-30px) rotate(2deg); }
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(540deg); opacity: 0; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body {
                align-items: flex-start;
                padding: max(0.8rem, env(safe-area-inset-top)) max(0.8rem, env(safe-area-inset-right))
                    max(0.8rem, env(safe-area-inset-bottom)) max(0.8rem, env(safe-area-inset-left));
            }

            .container {
                gap: 1rem;
                margin: auto 0;
                padding: 1.4rem 1rem;
                border-radius: 26px;
            }

            .message-box {
                padding: 0.8rem 0.9rem;
            }

            .btn {
                width: 100%;
                max-width: 340px;
                white-space: normal;
            }

            .balloon {
                font-size: clamp(2rem, 6vw, 3rem);
            }
        }

        @media (max-height: 560px) and (min-width: 481px) {
            body {
                align-items: flex-start;
            }

            .container {
                margin: 0.5rem 0;
                gap: 0.7rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div id="introOverlay" class="intro-overlay">
        <span id="introEmoji" class="intro-emoji">✨</span>
    </div>

    <div class="container">
        <div class="intro-section">
            <p class="intro-text">🎉 A little celebration just for you 🎉</p>
        </div>

        <div style="text-align: center;">
            <h1 class="title">Happy<br>Birthday</h1>
            <div class="heart">❤️</div>

            <div class="celebrate-section">
                <p class="celebrate-text">Ready to celebrate?</p>
                <button class="btn" type="button" onclick="celebrate()">🎉 Celebrate your special day</button>
            </div>
        </div>

        <div class="message-box">
            <p class="message">Wishing you a day filled with joy, laughter, and unforgettable memories.</p>
            <p class="message" style="font-weight: 500;">Let's make this celebration extra special!</p>
            <p class="message" style="margin-bottom: 0; font-weight: 600;">Today is yours ❤️</p>
        </div>

        <p id="partyText" class="party-text" style="display: none;">Let the party begin! 🎊</p>
    </div>

    <audio id="birthdayAudio" src="birthday-song.mp3" preload="auto"></audio>

    <script>
        const introOverlay = document.getElementById('introOverlay');
        const introEmoji = document.getElementById('introEmoji');
        const partyText = document.getElementById('partyText');

        function celebrate() {
            showIntroEmoji();
        }

        function showIntroEmoji() {
            const emojis = ['✨', '🎂', '🎈', '🥳', '🎉'];
            introEmoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            introOverlay.classList.add('visible');

            setTimeout(() => {
                introOverlay.classList.remove('visible');
                startBirthdayExperience();
            }, 1200);
        }

        function startBirthdayExperience() {
            if (partyText) {
                partyText.style.display = 'block';
            }
            
            createStars(14);
            createConfetti(60);
            playCelebrationAudio();

            setTimeout(() => {
                createStars(18);
                createConfetti(60);
            }, 1200);

            setTimeout(() => {
                alert('🎉 HAPPY BIRTHDAY! 🎉\n\nHave an amazing day! 🥳');
            }, 2800);
        }

        function createConfetti(amount) {
            for (let i = 0; i < amount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                const size = 8 + Math.random() * 12;
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size}px`;
                confetti.style.left = `${Math.random() * window.innerWidth}px`;
                confetti.style.top = `${-40 - Math.random() * 40}px`;
                confetti.style.backgroundColor = ['#ff6b81', '#ffd166', '#4ea8ff', '#70ffb1', '#8257e5'][Math.floor(Math.random() * 5)];
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                confetti.style.animationDuration = `${2 + Math.random() * 2}s`;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4500);
            }
        }

        function createStars(amount) {
            for (let i = 0; i < amount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = `${Math.random() * window.innerWidth}px`;
                star.style.top = `${Math.random() * window.innerHeight}px`;
                star.style.animationDuration = `${1 + Math.random() * 1}s`;
                document.body.appendChild(star);
                setTimeout(() => star.remove(), 1600);
            }
        }

        function playCelebrationAudio() {
            const audio = document.getElementById('birthdayAudio');
            if (audio && typeof audio.play === 'function') {
                audio.currentTime = 0;
                audio.play().catch(() => playBirthdaySong());
            } else {
                playBirthdaySong();
            }
        }

        function playBirthdaySong() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                const notes = [
                    { freq: 262, duration: 0.5 },
                    { freq: 262, duration: 0.5 },
                    { freq: 294, duration: 1 },
                    { freq: 262, duration: 1 },
                    { freq: 330, duration: 1 },
                    { freq: 294, duration: 2 },
                    { freq: 262, duration: 0.5 },
                    { freq: 262, duration: 0.5 },
                    { freq: 294, duration: 1 },
                    { freq: 262, duration: 1 },
                    { freq: 349, duration: 1 },
                    { freq: 330, duration: 2 }
                ];

                let currentTime = audioContext.currentTime;
                notes.forEach(note => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    oscillator.frequency.value = note.freq;
                    gainNode.gain.setValueAtTime(0.3, currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, currentTime + note.duration);
                    oscillator.start(currentTime);
                    oscillator.stop(currentTime + note.duration);
                    currentTime += note.duration;
                });
            } catch (error) {
                console.log('Audio not available, but celebration continues!');
            }
        }
    </script>
</body>
</html>
